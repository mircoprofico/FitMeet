name: CI

on:
  pull_request:
    branches: [main]

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Zulu 21 : le projet epingle le vendor Azul dans
      # gradle/gradle-daemon-jvm.properties. Un autre JDK forcerait Gradle
      # a telecharger le sien a chaque build.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      # Garde les dependances et les resultats de compilation d'un build
      # a l'autre. Sans ca, chaque build retelecharge tout.
      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew :androidApp:lintDebug

      - name: Tests partages
        run: ./gradlew :shared:allTests

      - name: Build APK
        run: ./gradlew :androidApp:assembleDebug

      # Recupere l'APK avant que la machine s'eteigne : il devient
      # telechargeable depuis l'onglet Actions.
      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: fitmeet-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7


  # Deuxieme machine, sous macOS : compiler pour iOS exige les outils Apple.
  # Elle demarre vierge, d'ou la repetition des etapes de preparation.
  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # On compile le framework Kotlin partage, pas l'app Xcode.
      - name: Compiler le framework partage
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
